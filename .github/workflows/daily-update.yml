name: daily-update

on:
  schedule:
    # 台灣週二至週六 06:17：美股收盤後更新（UTC 前一天 22:17）。
    - cron: "17 22 * * 1-5"
    # 台灣週二至週六 10:17：自動補抓來源延遲行情。
    - cron: "17 2 * * 2-6"
    # 交易日曆決定最近已收盤交易日；美國休市不要求不存在的報價。
  push:
    branches: [main]      # 每次 push 到 main 也會自動部署
  workflow_dispatch: {}   # 也可在 GitHub 網頁上手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize the entire build/deploy so an older run cannot overwrite a newer one.
concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regression tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_frontend.cjs

      - name: Restore verified Yahoo daily bars
        uses: actions/cache/restore@v4
        with:
          path: data/raw/.cache
          key: yahoo-verified-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yahoo-verified-v1-

      - name: Run daily pipeline
        run: python run_daily.py

      - name: Save verified Yahoo daily bars
        if: ${{ !cancelled() && hashFiles('data/raw/.cache/yahoo_verified.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/raw/.cache
          key: yahoo-verified-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # 不再 commit 回 repo:資料每次部署時即時重產,避免與手動上傳衝突

      - name: Upload app for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: update-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
